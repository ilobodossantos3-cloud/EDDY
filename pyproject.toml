[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eddy-os"
version = "0.1.0"
description = "Eddy: assistente de voz que controla o PC (API ou modelo local)"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6", "python-dotenv>=1", "httpx>=0.27", "jsonschema>=4",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "psutil>=5.9", "send2trash>=1.8",
  "apscheduler>=3.10,<4", "numpy>=1.26",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6", "faster-whisper>=1.0", "keyboard>=0.13; sys_platform == 'win32'"]
control = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9; sys_platform == 'win32'", "pycaw>=20230407; sys_platform == 'win32'", "comtypes; sys_platform == 'win32'", "mss>=9"]
window = ["pywebview>=5"]
local-gguf = ["llama-cpp-python>=0.2.90"]
local-hf = ["transformers>=4.44", "torch", "accelerate", "huggingface_hub"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["eddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
